[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiktok-quality-fix"
version = "2.0.0"
description = "Upload 1080p 60fps on TikTok using CompressBase method"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "krutkrutaya" }]
keywords = ["tiktok", "mp4", "video", "1080p60", "1080p", "60fps", "upload", "quality", "compressbase", "ffmpeg"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.scripts]
tiktok-quality = "tiktok_quality.cli:main"
tiktok-quality-gui = "tiktok_quality.gui:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/krutkrutaya/tiktok-quality-fix"

[tool.hatch.build.targets.wheel]
packages = ["src/tiktok_quality"]

[tool.hatch.build.targets.wheel.force-include]
"src/tiktok_quality/target_spec.json" = "tiktok_quality/target_spec.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
